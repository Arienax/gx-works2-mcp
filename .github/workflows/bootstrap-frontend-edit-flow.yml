name: Bootstrap Stable Frontend Edit Flow

on:
  push:
    branches: [refactor/generation-fast-path]
    paths:
      - '.github/workflows/bootstrap-frontend-edit-flow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Apply exact frontend state-flow changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('web/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one preimage, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const activeProjectRef = useRef(pid);\n  const projectEpoch = useRef(0);\n',
              '  const activeProjectRef = useRef(pid);\n  const projectEpoch = useRef(0);\n  const composerProjectRef = useRef("");\n',
              'composer project ref',
          )
          replace_once(
              '        setProject(value);\n        if (!value.versions?.length && value.target_mode === "fbd") setTab("fbd");\n',
              '        setProject(value);\n        if (composerProjectRef.current !== value.id) {\n          composerProjectRef.current = value.id;\n          setIntent(value.confirmed_spec && (value.versions?.length || 0) > 0\n            ? "generation"\n            : "analysis");\n        }\n        if (!value.versions?.length && value.target_mode === "fbd") setTab("fbd");\n',
              'project composer default',
          )
          replace_once(
              '        setRefresh((n) => n + 1);\n',
              '        void reloadProjectSilently(value.project_id);\n',
              'terminal job refresh',
          )
          helper = '''  async function reloadProjectSilently(targetPid = pid) {
              const epoch = projectEpoch.current;
              if (!targetPid || activeProjectRef.current !== targetPid) return;
              const fresh = await api<Project>(`/projects/${targetPid}`);
              if (epoch !== projectEpoch.current ||
                  activeProjectRef.current !== targetPid || fresh.id !== targetPid) return;
              setProject(fresh);
              setProjects((old) => old.map((item) => item.id === fresh.id ? fresh : item));
              setVid((old) => fresh.versions?.some((item) => item.id === old)
                ? old
                : fresh.active_version_id || fresh.versions?.[0]?.id || "");
              const binding = fresh.id + ":" + (fresh.confirmed_spec_hash || "");
              if (!specDirty.current && specBinding.current !== binding) {
                specBinding.current = binding;
                setSpec((fresh.confirmed_spec as Spec) || null);
              }
            }

          '''
          replace_once('  async function refreshDrawing() {\n', helper + '  async function refreshDrawing() {\n', 'silent reload helper')
          replace_once(
              '      else { setOutputRetry((n) => n + 1); refreshAll(); return; }\n      if (epoch === projectEpoch.current) {\n        setOutputRetry((n) => n + 1);\n        refreshAll();\n',
              '      else { setOutputRetry((n) => n + 1); void reloadProjectSilently(pid); return; }\n      if (epoch === projectEpoch.current) {\n        setOutputRetry((n) => n + 1);\n        void reloadProjectSilently(pid);\n',
              'drawing refresh',
          )
          replace_once(
              '    if (!project || project.id !== pid) return;\n    if (kind === "generation" && !canGenerate) return;\n    const epoch = projectEpoch.current;\n',
              '    if (!project || project.id !== pid) return;\n    const epoch = projectEpoch.current;\n',
              'generation client guard',
          )
          replace_once(
              '    setPanel("agent");\n    setAttachments([]);\n    refreshAll();\n  }\n  async function saveSpec(value: Spec) {\n    const epoch = projectEpoch.current;\n',
              '    setPanel("agent");\n    setAttachments([]);\n    if (kind === "generation") setText("");\n  }\n  async function saveSpec(value: Spec) {\n    const epoch = projectEpoch.current;\n    const generateAfterSave = currentJob?.kind === "analysis" &&\n      currentJob.status === "completed" && !!analysisOutput?.spec_draft &&\n      jobId === currentJob.id;\n',
              'submit/save transition',
          )
          replace_once(
              '    setNotice(t("规格已确认"));\n    setIntent("generation");\n    setPanel("agent");\n    refreshAll();\n  }\n',
              '    setNotice(t("规格已确认"));\n    setIntent("generation");\n    setPanel("agent");\n    if (generateAfterSave) await submitJob("generation");\n    else void reloadProjectSilently(pid);\n  }\n',
              'confirm specification transition',
          )
          replace_once(
              '    setSelectedProposal(null);\n    setPreview(null);\n    setNotice(t("操作完成"));\n    refreshAll();\n  }\n',
              '    setSelectedProposal(null);\n    setPreview(null);\n    setNotice(t("操作完成"));\n    await reloadProjectSilently(pid);\n  }\n',
              'proposal decision refresh',
          )
          replace_once(
              '              await api(`/projects/${pid}/active-version`, "POST", {version_id:vid,expected_active_version_id:project?.active_version_id});\n              refreshAll();\n',
              '              await api(`/projects/${pid}/active-version`, "POST", {version_id:vid,expected_active_version_id:project?.active_version_id});\n              await reloadProjectSilently(pid);\n',
              'activate version refresh',
          )
          replace_once(
              '                    onRetry={() => { setOutputRetry((n) => n + 1); refreshAll(); }}\n',
              '                    onRetry={() => { setOutputRetry((n) => n + 1); void reloadProjectSilently(pid); }}\n',
              'generation result retry',
          )
          replace_once(
              '                  await api(`/jobs/${jobId}/cancel`, "POST");\n                  refreshAll();\n',
              '                  await api(`/jobs/${jobId}/cancel`, "POST");\n                  void reloadProjectSilently(pid);\n',
              'cancel refresh',
          )
          path.write_text(text, encoding='utf-8', newline='')

          Path('tests/test_web_frontend_state_flow.py').write_text('''from pathlib import Path\n\nAPP = (Path(__file__).parents[1] / "web" / "src" / "App.tsx").read_text(encoding="utf-8")\n\ndef _between(start: str, end: str) -> str:\n    return APP.split(start, 1)[1].split(end, 1)[0]\n\ndef test_existing_confirmed_project_defaults_to_generation_edit_mode():\n    assert "composerProjectRef.current !== value.id" in APP\n    assert "value.confirmed_spec && (value.versions?.length || 0) > 0" in APP\n\ndef test_job_completion_is_silent():\n    sse = _between("stream.onmessage = (event) => {", "return () => {\\n      stopped = true;\\n      stream.close();")\n    assert "reloadProjectSilently(value.project_id)" in sse\n    assert "setRefresh(" not in sse\n\ndef test_submit_generation_does_not_force_global_refresh():\n    submit = _between("async function submitJob(", "async function saveSpec(")\n    assert "kind === \\\"generation\\\" && !canGenerate" not in submit\n    assert "refreshAll()" not in submit\n\ndef test_confirmed_analysis_continues_to_generation_without_global_refresh():\n    save = _between("async function saveSpec(", "async function showProposal(")\n    assert "generateAfterSave" in save\n    assert "await submitJob(\\\"generation\\\")" in save\n    assert "refreshAll()" not in save\n\ndef test_silent_reload_does_not_block_editor():\n    silent = _between("async function reloadProjectSilently(", "async function refreshDrawing(")\n    assert "setLoading(" not in silent\n''', encoding='utf-8', newline='')
          '@ | python
          if ($LASTEXITCODE -ne 0) { throw 'Frontend replacement failed.' }
      - name: Commit frontend source changes
        shell: pwsh
        run: |
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add web/src/App.tsx tests/test_web_frontend_state_flow.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'fix(web): keep edit flow incremental and refresh silently'
          git push origin HEAD:refactor/generation-fast-path
