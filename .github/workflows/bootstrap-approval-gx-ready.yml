name: Bootstrap Approval GX Readiness Fixture

on:
  push:
    branches: [refactor/generation-fast-path]
    paths:
      - '.github/workflows/bootstrap-approval-gx-ready.yml'
      - 'scripts/_bootstrap_approval_gx_ready.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Apply fixture update
        run: python scripts/_bootstrap_approval_gx_ready.py
      - name: Validate approval and GX/delete regressions
        run: |
          python -m pytest -q `
            tests/test_approval_modes.py `
            tests/test_gx_execution_ui_and_project_delete.py `
            tests/test_execution_coordinator.py `
            tests/test_web_api.py
      - name: Commit fixture update
        run: |
          git rm scripts/_bootstrap_approval_gx_ready.py
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add tests/test_approval_modes.py
          git diff --cached --check
          git commit -m 'test(web): model GX readiness in approval fixtures'
          git push origin HEAD:refactor/generation-fast-path
