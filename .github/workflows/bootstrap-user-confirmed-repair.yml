name: Bootstrap User Confirmed Structural Repair

on:
  push:
    branches: [fix/user-confirmed-structural-repair]
    paths:
      - '.github/workflows/bootstrap-user-confirmed-repair.yml'
      - 'scripts/_bootstrap_user_confirmed_repair.py'
      - 'scripts/_bootstrap_user_confirmed_repair_v2.py'

permissions:
  contents: write

concurrency:
  group: bootstrap-user-confirmed-repair
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap:')
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m pip check
      - name: Apply source changes
        run: |
          python scripts/_bootstrap_user_confirmed_repair.py
          python scripts/_bootstrap_user_confirmed_repair_v2.py
      - name: Compile and run generation/Web regressions
        run: |
          python -m compileall -q src tests
          python -m pytest -q `
            tests/test_generation_fast_path.py `
            tests/test_generation_workflow.py `
            tests/test_generation_repair_workflow.py `
            tests/test_user_confirmed_generation_repair.py `
            tests/test_generation_delivery.py `
            tests/test_approval_modes.py `
            tests/test_plc_core_boundary.py `
            tests/test_plc_ir.py `
            tests/test_application_job_errors.py `
            tests/test_web_api.py `
            tests/test_web_contract.py `
            tests/test_web_frontend_state_flow.py `
            tests/test_gx_execution_ui_and_project_delete.py `
            tests/test_prompt_context_policy.py `
            tests/test_context_refresh_runtime.py `
            tests/test_runtime_diagnostics.py `
            tests/test_runtime_diagnostics_web.py
      - name: Keep strict validators available outside direct generation
        run: |
          python -m pytest -q `
            tests/test_approach_contracts.py `
            tests/test_timer_semantics_regressions.py `
            tests/test_motion_control_regressions.py `
            tests/test_analog_instruction_regressions.py `
            tests/test_contract_repair_policy.py `
            tests/test_instruction_registry.py
      - name: Regenerate Web schema and build frontend
        run: |
          python scripts/export_web_schema.py
          Push-Location web
          npm ci
          npm run types
          npm run build
          Pop-Location
      - name: Commit real source changes
        run: |
          git rm scripts/_bootstrap_user_confirmed_repair.py scripts/_bootstrap_user_confirmed_repair_v2.py
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add `
            src/application/generation.py `
            src/application/generation_repair.py `
            src/application/workbench.py `
            src/plc_generation_contract.py `
            src/integrations/web/schemas.py `
            src/integrations/web/responses.py `
            src/integrations/web/app.py `
            web/src/App.tsx `
            web/src/features/JobFailure.tsx `
            web/openapi.json `
            web/src/api/generated.ts `
            tests/test_user_confirmed_generation_repair.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'fix(generation): add user-confirmed structural repair'
          git push origin HEAD:fix/user-confirmed-structural-repair