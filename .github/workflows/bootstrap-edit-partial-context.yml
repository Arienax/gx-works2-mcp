name: Bootstrap Incremental Edit Context Fix

on:
  push:
    branches: [refactor/generation-fast-path]
    paths:
      - '.github/workflows/bootstrap-edit-partial-context.yml'
      - 'build_inputs/edit-partial-context.patch'

permissions:
  contents: write

concurrency:
  group: bootstrap-edit-partial-context
  cancel-in-progress: false

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Apply exact source replacements
        run: |
          @'
          from pathlib import Path

          generation = Path('src/application/generation.py')
          text = generation.read_text(encoding='utf-8')

          old = '''        self.conversation_history = self.conversation_history or []
        self.task_type = self.task_type or ("edit" if self.previous_json is not None else "generate")
        self.previous_ir = self.previous_ir if is_plc_ir(self.previous_ir) else None
'''
          new = '''        self.conversation_history = self.conversation_history or []
        self.task_type = self.task_type or ("edit" if self.previous_json is not None else "generate")
        # ``previous_json`` used to be available only to the local merge step.
        # An edit model therefore knew it was editing but could not see the
        # current program and often regenerated the whole ladder from the spec.
        if self.current_version_json is None and self.previous_json is not None:
            self.current_version_json = copy.deepcopy(self.previous_json)
        self.previous_ir = self.previous_ir if is_plc_ir(self.previous_ir) else None
'''
          if text.count(old) != 1:
              raise SystemExit('generation init preimage mismatch')
          text = text.replace(old, new, 1)

          old = '''            is_edit_mode = self.target_mode == "ladder" and self.previous_json is not None
            try:
'''
          new = '''            is_edit_mode = self.target_mode == "ladder" and self.previous_json is not None
            model_user_input = self.user_input
            if is_edit_mode and not self.repair_mode:
                model_user_input = (
                    '这是对系统提供的 Current version JSON 的增量编辑。必须返回 mode="partial"；'
                    'device_comments 只列新增或修改项，rungs 只列修改或新增的完整梯级，'
                    'delete_rung_ids 只列需要删除的梯级。不得重复输出未修改梯级，也不要重新生成完整程序。'
                    '只有用户明确要求整体重写/全部重新生成时，才允许返回完整 JSON。\\n\\n'
                    '用户修改要求：\\n'
                    + self.user_input
                )
            try:
'''
          if text.count(old) != 1:
              raise SystemExit('edit-mode preimage mismatch')
          text = text.replace(old, new, 1)

          old = '''                _reasoning, full_content = model_call(
                    stream_model_response,
                    self.user_input,
'''
          new = '''                _reasoning, full_content = model_call(
                    stream_model_response,
                    model_user_input,
'''
          if text.count(old) != 1:
              raise SystemExit('stream call preimage mismatch')
          text = text.replace(old, new, 1)

          old = '''                json_str = model_call(
                    self.dependencies.generate_json or api.generate_model_json,
                    self.user_input,
'''
          new = '''                json_str = model_call(
                    self.dependencies.generate_json or api.generate_model_json,
                    model_user_input,
'''
          if text.count(old) != 1:
              raise SystemExit('fallback call preimage mismatch')
          text = text.replace(old, new, 1)
          generation.write_text(text, encoding='utf-8', newline='')

          tests = Path('tests/test_generation_workflow.py')
          text = tests.read_text(encoding='utf-8')
          if not text.startswith('import copy\n'):
              if text.count('import json\n') != 1:
                  raise SystemExit('test import preimage mismatch')
              text = text.replace('import json\n', 'import copy\nimport json\n', 1)

          marker = '''@pytest.mark.parametrize("mutation", ["delete", "rung", "device", "comment", "full"])
'''
          test_case = '''def test_edit_generation_sends_current_program_and_requests_partial_output(tmp_path):
    base = _ladder()
    changed_rung = copy.deepcopy(base["rungs"][0])
    changed_rung["branches"][0]["inputs"][0]["type"] = "NC"
    partial = {
        "mode": "partial",
        "device_comments": {},
        "rungs": [changed_rung],
        "delete_rung_ids": [],
    }
    observed = {}

    def stream(user_input, *args, **kwargs):
        observed["user_input"] = user_input
        observed["current_version_json"] = copy.deepcopy(kwargs.get("current_version_json"))
        observed["is_edit_mode"] = kwargs.get("is_edit_mode")
        return "", json.dumps(partial, ensure_ascii=False)

    result = GenerationWorkflow(
        GenerationRequest("把 X0 改成常闭", previous_json=base, model_name="offline"),
        tmp_path,
        dependencies=GenerationDependencies(stream_response=stream),
    ).run()

    assert observed["is_edit_mode"] is True
    assert observed["current_version_json"] == base
    assert 'mode="partial"' in observed["user_input"]
    assert "不得重复输出未修改梯级" in observed["user_input"]
    persisted = json.loads((tmp_path / "ladder.json").read_text(encoding="utf-8"))
    assert len(persisted["rungs"]) == 1
    assert persisted["rungs"][0]["branches"][0]["inputs"][0]["type"] == "NC"
    assert result["repair_attempts"] == 0


'''
          if 'test_edit_generation_sends_current_program_and_requests_partial_output' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('test insertion preimage mismatch')
              text = text.replace(marker, test_case + marker, 1)
          tests.write_text(text, encoding='utf-8', newline='')
          '@ | python
          if ($LASTEXITCODE -ne 0) { throw 'Exact source replacement failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source replacement introduced whitespace errors.' }
      - name: Run focused generation tests
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m compileall -q src tests
          python -m pytest -q tests/test_generation_workflow.py tests/test_generation_repair_workflow.py tests/test_generation_delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Incremental edit regression tests failed.' }
      - name: Commit source fix
        run: |
          git rm build_inputs/edit-partial-context.patch
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'fix(generation): restore partial edits against current program'
          git push origin HEAD:refactor/generation-fast-path
