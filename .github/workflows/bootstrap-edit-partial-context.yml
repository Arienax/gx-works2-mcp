name: Bootstrap Incremental Edit Context Fix

on:
  push:
    branches: [refactor/generation-fast-path]
    paths:
      - '.github/workflows/bootstrap-edit-partial-context.yml'
      - 'build_inputs/edit-partial-context.patch'

permissions:
  contents: write

concurrency:
  group: bootstrap-edit-partial-context
  cancel-in-progress: false

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Apply incremental edit patch
        run: |
          git apply --check build_inputs/edit-partial-context.patch
          if ($LASTEXITCODE -ne 0) { throw 'Incremental edit patch does not apply cleanly.' }
          git apply --index build_inputs/edit-partial-context.patch
          if ($LASTEXITCODE -ne 0) { throw 'Incremental edit patch failed.' }
      - name: Run focused generation tests
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m compileall -q src tests
          python -m pytest -q tests/test_generation_workflow.py tests/test_generation_repair_workflow.py tests/test_generation_delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Incremental edit regression tests failed.' }
      - name: Commit source fix
        run: |
          git rm build_inputs/edit-partial-context.patch
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'fix(generation): restore partial edits against current program'
          git push origin HEAD:refactor/generation-fast-path
