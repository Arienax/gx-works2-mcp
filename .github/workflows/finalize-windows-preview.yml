name: Finalize Verified Windows Preview

# One-time recovery for an already-built and independently downloaded artifact.
# This workflow does not rebuild, replace assets, move tags, or alter application code.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-windows-preview.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: finalize-windows-preview-1
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Arienax/gxworks-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify original build, exact asset hashes, and publish existing draft by ID
        shell: python
        run: |
          import json, os, subprocess
          repo = os.environ['GH_REPO']
          sha = '8958357b2d10486c5d51d6d033f5ecb67248ade8'
          tag = 'v0.1.0-preview.1'
          release_id = 386374952
          run_id = 34491346207
          expected = {
              'build-info.json': (3258, 'sha256:65f3889b09b2f851f9347d9551656adf17444410afaffae913921a68b0b31b70'),
              'GXWorks-Agent-Web-v0.1.0-preview.1-Windows-x64.zip': (72449878, 'sha256:99bfbf46cb517a1fd365f4afec3bd214abdc24e5ae39edfbbee1cb543c09a904'),
              'package-smoke.json': (402, 'sha256:2de48ef226b03ba4933e4e971d9126ddf9cb5afc914bd1df524090aa4f3daf11'),
              'SHA256SUMS.txt': (287, 'sha256:a33178c36272356554cfbd5cdea1dd924d475e56992d76fec3f5fadec64f0697'),
          }
          def api(path, *args):
              result = subprocess.run(['gh', 'api', f'repos/{repo}/{path}', *args], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)
          run = api(f'actions/runs/{run_id}')
          assert run['head_sha'] == sha and run['head_branch'] == 'main' and run['event'] == 'push'
          jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          build = [job for job in jobs if job['name'] == 'build']
          assert len(build) == 1 and build[0]['conclusion'] == 'success'
          assert any(step['name'] == 'Archive, extract, and smoke-test the actual release ZIP' and step['conclusion'] == 'success' for step in build[0]['steps'])
          def verify(release):
              assert release['tag_name'] == tag and release['target_commitish'] == sha
              assert release['prerelease'] is True and release['author']['login'] == 'github-actions[bot]'
              assets = release['assets']
              assert len(assets) == len(expected) and {asset['name'] for asset in assets} == set(expected)
              for asset in assets:
                  size, digest = expected[asset['name']]
                  assert asset['state'] == 'uploaded' and asset['size'] == size and asset['digest'] == digest
          release = api(f'releases/{release_id}')
          verify(release)
          if release['draft']:
              api(f'releases/{release_id}', '--method', 'PATCH', '-F', 'draft=false')
          published = api(f'releases/{release_id}')
          verify(published)
          assert published['draft'] is False and published['published_at']
          assert api(f'commits/{tag}')['sha'] == sha
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Published [{tag}]({published['html_url']}) with four SHA-256 verified assets. No rebuild or asset replacement was performed.\n")
          print(published['html_url'])
