name: Bootstrap Analysis Design RAG

on:
  push:
    branches: [fix/user-confirmed-structural-repair]
    paths:
      - '.github/workflows/bootstrap-analysis-design-rag.yml'
      - 'scripts/_bootstrap_analysis_design_rag.py'
      - 'scripts/_bootstrap_analysis_design_rag_v2.py'
      - 'scripts/_bootstrap_analysis_design_rag_v3.py'
      - 'scripts/_bootstrap_analysis_design_rag_v4.py'

permissions:
  contents: write

concurrency:
  group: bootstrap-analysis-design-rag
  cancel-in-progress: false

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, 'bootstrap:')
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m pip check
      - name: Apply analysis retrieval routing
        run: |
          python scripts/_bootstrap_analysis_design_rag.py
          python scripts/_bootstrap_analysis_design_rag_v2.py
          python scripts/_bootstrap_analysis_design_rag_v3.py
          python scripts/_bootstrap_analysis_design_rag_v4.py
      - name: Import curated design knowledge
        run: python tools/import_design_patterns.py
      - name: Rebuild local dense index
        run: python tools/build_dense_embeddings.py
      - name: Diagnose retrieval lanes
        run: |
          @'
          import inspect
          import traceback
          import api
          import knowledge_retriever
          from prompt_context_policy import context_policy_scope

          q = "FX3U 三个工位依次执行，包含多阶段顺序和延时"
          print("=== API SOURCE ===")
          print(inspect.getsource(api._build_knowledge_context))
          print("=== DESIGN LANE ===")
          try:
              print(knowledge_retriever.retrieve_design_knowledge(q, plc_model="FX3U", task_type="analysis", top_k=2, char_budget=2400))
          except Exception:
              traceback.print_exc()
          print("=== MERGED CONTEXT ===")
          try:
              print(knowledge_retriever.build_knowledge_context(q, plc_model="FX3U", task_type="analysis", top_k=4, char_budget=7000))
          except Exception:
              traceback.print_exc()
          print("=== API MONKEYPATCH ===")
          def fake(query, **kwargs):
              print("FAKE CALLED", query, kwargs)
              return "# retrieved"
          knowledge_retriever.build_knowledge_context = fake
          try:
              with context_policy_scope("adaptive"):
                  print(api._build_knowledge_context("普通三工位顺序控制", plc_model="FX3U", task_type="analysis"))
          except Exception:
              traceback.print_exc()
          '@ | python
      - name: Stop after diagnostics
        run: exit 1
