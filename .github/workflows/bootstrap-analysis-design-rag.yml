name: Bootstrap Analysis Design RAG

on:
  push:
    branches: [fix/user-confirmed-structural-repair]
    paths:
      - '.github/workflows/bootstrap-analysis-design-rag.yml'
      - 'scripts/_bootstrap_analysis_design_rag.py'
      - 'scripts/_bootstrap_analysis_design_rag_v2.py'
      - 'scripts/_bootstrap_analysis_design_rag_v3.py'
      - 'scripts/_bootstrap_analysis_design_rag_v4.py'
      - 'scripts/_bootstrap_analysis_design_rag_v5.py'
      - 'scripts/_bootstrap_analysis_design_rag_v6.py'

permissions:
  contents: write

concurrency:
  group: bootstrap-analysis-design-rag
  cancel-in-progress: false

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, 'bootstrap:')
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m pip check
      - name: Apply analysis retrieval routing
        run: |
          python scripts/_bootstrap_analysis_design_rag.py
          python scripts/_bootstrap_analysis_design_rag_v2.py
          python scripts/_bootstrap_analysis_design_rag_v3.py
          python scripts/_bootstrap_analysis_design_rag_v4.py
          python scripts/_bootstrap_analysis_design_rag_v5.py
          python scripts/_bootstrap_analysis_design_rag_v6.py
      - name: Import curated design knowledge
        run: python tools/import_design_patterns.py
      - name: Rebuild local dense index
        run: python tools/build_dense_embeddings.py
      - name: Verify retrieval lanes
        run: |
          @'
          import knowledge_retriever
          q = 'FX3U 三个工位依次执行，包含多阶段顺序和延时'
          design = knowledge_retriever.retrieve_design_knowledge(q, plc_model='FX3U', task_type='analysis', top_k=2, char_budget=2400)
          assert design, 'analysis design lane returned no curated design chunks'
          assert all(item.get('manual_id') == 'curated_control_design' for item in design)
          generation = knowledge_retriever.retrieve_design_knowledge(q, plc_model='FX3U', task_type='generate', top_k=10, char_budget=10000)
          assert generation == [], 'curated design knowledge leaked into generation'
          merged = knowledge_retriever.build_knowledge_context(q, plc_model='FX3U', task_type='analysis', top_k=4, char_budget=7000)
          assert 'curated_control_design' in merged or 'CONTROL ARCHITECTURE' in merged
          '@ | python
      - name: Compile and test prompt/RAG boundaries
        run: |
          python -m compileall -q src tests tools/import_design_patterns.py tools/build_dense_embeddings.py
          python -m pytest -q `
            tests/test_analysis_design_rag.py `
            tests/test_analysis_format_repair.py `
            tests/test_prompt_context_policy.py `
            tests/test_motion_control_regressions.py `
            tests/test_approach_contracts.py `
            tests/test_generation_fast_path.py `
            tests/test_generation_workflow.py `
            tests/test_fx3u_rag.py `
            tests/test_web_api.py `
            tests/test_web_contract.py
      - name: Keep strict validator boundary intact
        run: |
          python -m pytest -q `
            tests/test_timer_semantics_regressions.py `
            tests/test_analog_instruction_regressions.py `
            tests/test_contract_repair_policy.py `
            tests/test_instruction_registry.py
      - name: Verify SQLite and manifest
        run: |
          @'
          import hashlib, json, sqlite3
          from pathlib import Path
          db = Path('resources/knowledge/fx3u_knowledge.sqlite')
          manifest_path = Path('resources/knowledge/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert b'\r\n' not in manifest_path.read_bytes(), 'manifest writer must be LF-stable'
          with sqlite3.connect(db) as cx:
              assert cx.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              assert cx.execute("SELECT COUNT(*) FROM chunks WHERE manual_id='curated_control_design'").fetchone()[0] == 6
              assert cx.execute("SELECT COUNT(*) FROM chunks WHERE manual_id='curated_control_design' AND chunk_type='design_pattern'").fetchone()[0] == 6
          sha = hashlib.sha256(db.read_bytes()).hexdigest()
          assert manifest['database_sha256'] == sha
          assert any(x.get('id') == 'curated_control_design' for x in manifest.get('curated_sources', []))
          '@ | python
      - name: Commit verified source and knowledge artifacts
        run: |
          git rm `
            scripts/_bootstrap_analysis_design_rag.py `
            scripts/_bootstrap_analysis_design_rag_v2.py `
            scripts/_bootstrap_analysis_design_rag_v3.py `
            scripts/_bootstrap_analysis_design_rag_v4.py `
            scripts/_bootstrap_analysis_design_rag_v5.py `
            scripts/_bootstrap_analysis_design_rag_v6.py `
            .github/workflows/bootstrap-analysis-design-rag.yml
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add `
            src/api.py `
            src/pattern_library.py `
            src/knowledge_retriever.py `
            src/knowledge_retriever_core.py `
            resources/knowledge/README.md `
            resources/knowledge/design_patterns.json `
            resources/knowledge/fx3u_knowledge.sqlite `
            resources/knowledge/fx3u_dense_lsa.npz `
            resources/knowledge/manifest.json `
            tools/import_design_patterns.py `
            tools/build_dense_embeddings.py `
            tests/test_analysis_design_rag.py `
            tests/test_motion_control_regressions.py `
            .github/workflows/generation-fast-path.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'refactor(prompt): retrieve architecture design knowledge from SQLite'
          git push origin HEAD:fix/user-confirmed-structural-repair