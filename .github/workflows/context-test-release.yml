name: Context Diagnostics Windows Test Release

on:
  push:
    branches: [test/context-runtime-diagnostics]
    paths:
      - '.github/workflows/context-test-release.yml'
      - 'build_inputs/context_edits.json'
      - 'build_inputs/diagnostics*'
      - 'src/runtime_diagnostics.py'
      - 'web/src/features/JobFailure.tsx'
      - 'tests/test_runtime_diagnostics*'
      - 'scripts/*diagnostic*'
      - 'DIAGNOSTICS_README.zh-CN.md'
      - 'src/prompt_context_policy.py'
      - 'scripts/*context*'
      - 'scripts/web_entry.py'
      - 'tests/test_*context*'
      - 'start-adaptive.cmd'
      - 'start-legacy.cmd'
      - 'START_CONTEXT_TEST.cmd'

permissions:
  contents: read

concurrency:
  group: context-diagnostics-release
  cancel-in-progress: false

jobs:
  windows-test-release:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GXWORKS_CONTEXT_POLICY: legacy
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply reviewed hooks with exact preimage and output verification
        run: |
          python scripts/prepare_context_test_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned context preparation failed.' }
          python scripts/prepare_diagnostics_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic preparation failed.' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item build/context-test/* release-assets/
      - name: Install existing Web build dependencies and test tools
        run: |
          python -m pip install -r requirements-web.txt pyinstaller==6.21.0 pytest==9.1.1 playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency failed.' }
          python -m compileall -q src scripts tests/test_prompt_context_policy.py tests/test_context_refresh_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
      - name: Validate all policies against the actual refresh backend
        run: |
          python -m pytest -q tests/test_prompt_context_policy.py tests/test_context_refresh_runtime.py --junitxml=release-assets/context-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Context policy or actual backend regression failed.' }
      - name: Validate diagnostics and error export with real backend
        run: |
          python -m pytest -q tests/test_runtime_diagnostics.py tests/test_runtime_diagnostics_web.py tests/test_model_provider.py tests/test_response_language.py --junitxml=release-assets/runtime-diagnostics-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic observation or export regression failed.' }
      - name: Preserve generation repair and debug workflows
        run: |
          python -m pytest -q tests/test_generation_repair_assembly.py tests/test_generation_repair_workflow.py tests/test_generation_workflow.py tests/test_application_job_errors.py tests/test_approval_modes.py tests/test_application_planning.py tests/test_plc_debug_loop.py tests/test_review_noise_regressions.py tests/test_model_presentation.py --junitxml=release-assets/generation-debug-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Generation/debug regression failed.' }
      - name: Preserve delivery refresh and HTTP boundaries
        run: |
          python -m pytest -q tests/test_generation_delivery.py tests/test_web_api.py tests/test_web_contract.py tests/test_web_fbd.py --junitxml=release-assets/web-delivery-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Generation delivery/API regression failed.' }
      - name: Audit six strategies without live model calls
        run: |
          python tools/audit_prompt_context.py --cases tools/context_audit_cases.jsonl --output release-assets/context-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Real prompt assembly audit failed.' }
      - name: Validate materialized knowledge resources
        shell: python
        run: |
          import json, sqlite3
          from pathlib import Path
          import numpy as np
          root = Path('resources/knowledge')
          db = root / 'fx3u_knowledge.sqlite'
          with db.open('rb') as stream:
              assert stream.read(16) == b'SQLite format 3\0', 'Unmaterialized knowledge database'
          connection = sqlite3.connect(db.resolve().as_uri() + '?mode=ro', uri=True)
          try:
              assert connection.execute('PRAGMA quick_check').fetchall() == [('ok',)]
          finally:
              connection.close()
          with np.load(root / 'fx3u_dense_lsa.npz', allow_pickle=False) as dense:
              assert dense.files
              for name in dense.files:
                  dense[name]
          json.loads((root / 'manifest.json').read_text(encoding='utf-8-sig'))
      - name: Build the repository's x86 simulator gateway without running it
        run: |
          $gateway = Join-Path $env:RUNNER_TEMP 'context-simulator-gateway'
          & ./tools/build_simulator_gateway.ps1 -OutputDirectory $gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway compilation failed.' }
          "GATEWAY_DIRECTORY=$gateway" >> $env:GITHUB_ENV
      - name: Build frontend and Windows x64 executable
        run: |
          & ./scripts/build_web_package.ps1 -Python (Get-Command python.exe).Source -GatewayDirectory $env:GATEWAY_DIRECTORY
          if ($LASTEXITCODE -ne 0) { throw 'Windows Web build failed.' }
      - name: Install browser for existing acceptance checks
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
      - name: Preserve the specification-to-generation UI handoff
        run: |
          python scripts/web_spec_handoff_smoke.py --web-dist dist/GXWorks-Agent-Web/web/dist --report release-assets/web-spec-handoff.json
          if ($LASTEXITCODE -ne 0) { throw 'Specification handoff browser regression failed.' }
      - name: Exercise real result refresh with legacy and adaptive policies
        run: |
          foreach ($policy in @('legacy', 'adaptive')) {
            $env:GXWORKS_CONTEXT_POLICY = $policy
            New-Item -ItemType Directory -Path "release-assets/browser-$policy" -Force | Out-Null
            python scripts/web_generation_e2e.py --web-dist dist/GXWorks-Agent-Web/web/dist --report "release-assets/browser-$policy/generation-delivery-e2e.json"
            if ($LASTEXITCODE -ne 0) { throw "Real backend/browser refresh regression failed: $policy" }
          }
      - name: Verify error panel and real diagnostic ZIP download
        run: |
          python scripts/web_diagnostics_e2e.py --web-dist dist/GXWorks-Agent-Web/web/dist --report release-assets/diagnostic-ui.json
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic download browser regression failed.' }
      - name: Package and verify the actual extracted executable and launchers
        run: |
          python scripts/package_context_test_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Final ZIP verification failed.' }
      - name: Calculate delivery checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          assets = Path('release-assets')
          rows = []
          for path in sorted(assets.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS.txt':
                  with path.open('rb') as stream:
                      rows.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + path.relative_to(assets).as_posix())
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(rows) + '\n', encoding='utf-8')
      - name: Retain verified Windows test package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: gxworks-context-test-windows-${{ github.run_id }}
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain actionable diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: context-test-diagnostics-${{ github.run_id }}
          path: |
            release-assets/
            build/context-test/
            build/web/warn-web.txt
            src/prompt_context_policy.py
            build_inputs/context_edits.json
          if-no-files-found: warn
          retention-days: 7
