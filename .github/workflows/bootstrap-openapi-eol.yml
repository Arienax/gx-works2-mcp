name: Restore OpenAPI Line Endings

on:
  push:
    branches: [fix/user-confirmed-structural-repair]
    paths:
      - '.github/workflows/bootstrap-openapi-eol.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore repository OpenAPI CRLF convention
        run: |
          @'
          from pathlib import Path
          path = Path('web/openapi.json')
          text = path.read_text(encoding='utf-8')
          with path.open('w', encoding='utf-8', newline='') as handle:
              handle.write(text.replace('\r\n', '\n').replace('\r', '\n').replace('\n', '\r\n'))
          '@ | python
          git diff --numstat main...HEAD -- web/openapi.json
      - name: Commit normalized generated file
        run: |
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add web/openapi.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'chore(web): preserve OpenAPI line endings'
          git push origin HEAD:fix/user-confirmed-structural-repair
