name: Bootstrap GX Send And Project Delete

on:
  push:
    branches: [refactor/generation-fast-path]
    paths:
      - '.github/workflows/bootstrap-gx-send-delete.yml'
      - 'scripts/_bootstrap_gx_send_delete.py'
      - 'scripts/_bootstrap_gx_send_delete_v2.py'
      - 'scripts/_bootstrap_gx_send_delete_v3.py'

permissions:
  contents: write

concurrency:
  group: bootstrap-gx-send-delete
  cancel-in-progress: false

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m pip check
      - name: Apply exact source changes
        run: python scripts/_bootstrap_gx_send_delete_v3.py
      - name: Targeted Python regression
        run: |
          python -m pytest -q `
            tests/test_gx_execution_ui_and_project_delete.py `
            tests/test_execution_coordinator.py `
            tests/test_web_frontend_state_flow.py `
            tests/test_web_api.py
      - name: Build Web frontend
        run: |
          Push-Location web
          npm ci
          npm run build
          Pop-Location
      - name: Commit real source changes
        run: |
          git rm scripts/_bootstrap_gx_send_delete.py scripts/_bootstrap_gx_send_delete_v2.py scripts/_bootstrap_gx_send_delete_v3.py
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add src web tests
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'fix(web): make GX send deterministic and add project deletion'
          git push origin HEAD:refactor/generation-fast-path
