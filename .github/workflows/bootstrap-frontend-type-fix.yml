name: Bootstrap Frontend Silent Refresh Type Fix

on:
  push:
    branches: [refactor/generation-fast-path]
    paths:
      - '.github/workflows/bootstrap-frontend-type-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact type fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('web/src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = '  async function reloadProjectSilently(targetPid = pid) {\n'
          new = '  async function reloadProjectSilently(targetPid: string | null | undefined = pid) {\n'
          if text.count(old) != 1:
              raise SystemExit('silent refresh helper preimage mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          '@ | python
      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add web/src/App.tsx
          git diff --cached --check
          git commit -m 'fix(web): accept nullable project id in silent refresh'
          git push origin HEAD:refactor/generation-fast-path
