name: Bootstrap IO and GX Fast Path

on:
  push:
    branches: [fix/user-confirmed-structural-repair]
    paths:
      - '.github/workflows/bootstrap-io-gx-fastpath.yml'
      - 'scripts/_bootstrap_io_gx_fastpath.py'

permissions:
  contents: write

concurrency:
  group: bootstrap-io-gx-fastpath
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: contains(github.event.head_commit.message, 'bootstrap:')
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/src'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-web.txt
          python -m pip check
      - name: Apply focused fixes
        run: python scripts/_bootstrap_io_gx_fastpath.py
      - name: Compile and run focused regressions
        run: |
          python -m compileall -q src tests
          python -m pytest -x -vv `
            tests/test_io_protocol_and_gx_fastpath.py `
            tests/test_analysis_format_repair.py `
            tests/test_spec_choice_metadata.py `
            tests/test_execution_coordinator.py `
            tests/test_gxworks2_import.py `
            tests/test_gx_execution_ui_and_project_delete.py
      - name: Run generation and Web boundary regressions
        run: |
          python -m pytest -q `
            tests/test_generation_fast_path.py `
            tests/test_generation_workflow.py `
            tests/test_user_confirmed_generation_repair.py `
            tests/test_web_api.py `
            tests/test_web_contract.py `
            tests/test_web_frontend_state_flow.py `
            tests/test_analysis_design_rag.py
      - name: Commit verified source changes
        run: |
          git rm scripts/_bootstrap_io_gx_fastpath.py
          git config user.name 'Arienax'
          git config user.email '1307420856@qq.com'
          git add `
            src/api.py `
            src/application/execution.py `
            src/gxworks2/ui_automation.py `
            tests/test_io_protocol_and_gx_fastpath.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git commit -m 'fix(gx): preserve IO labels and speed up GX send'
          git push origin HEAD:fix/user-confirmed-structural-repair
